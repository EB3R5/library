<div class="tabs"><div class="t on">✏️ {{ relpath }}</div></div>
<div class="inner">
<h2>{{ it.title }}</h2>
<form hx-post="/edit/{{ it.id }}" hx-target="#side-panel">
  <input type="hidden" name="relpath" value="{{ relpath }}">
  <textarea class="editor" name="text">{{ text }}</textarea>
  <div style="display:flex;gap:8px;margin-top:8px">
    <button>💾 Save (commit)</button>
    <button type="button" class="ghost" hx-get="/panel/{{ it.id }}?tab=info"
      hx-target="#side-panel">Cancel</button>
  </div>
</form>
</div>
