<!doctype html><meta charset="utf-8">
<style>
  body { max-width: 760px; margin: 0 auto; padding: 30px 24px;
    font: 15px/1.65 -apple-system, sans-serif; color: #222; background: #fff; }
  pre { background: #f4f2ee; padding: 12px; border-radius: 8px; overflow-x: auto; }
  code { background: #f4f2ee; padding: 1px 4px; border-radius: 4px; font-size: 13px; }
  table { border-collapse: collapse; } td, th { border: 1px solid #ddd; padding: 5px 10px; }
  img { max-width: 100%; }
</style>
{{ body|safe }}
