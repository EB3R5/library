<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · library</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font: 13px/1.5 -apple-system, sans-serif; background: #1e1e24; color: #d6d9de; }
  form { width: 300px; background: #26262e; border: 1px solid #3a3f47; border-radius: 10px; padding: 22px; }
  h1 { font-size: 16px; margin: 0 0 14px; }
  label { display: block; color: #8888a0; font-size: 11px; text-transform: uppercase; letter-spacing: .1em; }
  input { width: 100%; background: #14141a; color: #ddd; border: 1px solid #3a3f47; border-radius: 6px;
    padding: 7px 8px; font-size: 13px; margin: 3px 0 12px; }
  button { width: 100%; background: #4a4add; color: #fff; border: 0; border-radius: 6px;
    padding: 8px 12px; cursor: pointer; font-size: 13px; }
  button:hover { filter: brightness(1.15); }
  .error { color: #e8b9b9; background: #2b1414; border: 1px solid #4a2020; border-radius: 6px;
    padding: 6px 8px; margin: 0 0 12px; }
</style></head>
<body>
  <form method="post" action="/login">
    <h1>library</h1>
    {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
    <label>Username
      <input name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" autofocus required>
    </label>
    <label>Password
      <input name="password" type="password" autocomplete="current-password" required>
    </label>
    <label>Authenticator code
      <input name="totp" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code" placeholder="123456" required>
    </label>
    <button type="submit">Sign in</button>
  </form>
</body></html>
