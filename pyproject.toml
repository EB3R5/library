[project]
name = "library"
version = "2.0.0"
description = "Workbench over a documents store (SQLite) with Claude-in-the-loop editing"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "fastapi",
    "uvicorn",
    "jinja2",
    "python-multipart",
    "markdown",
    "nh3",
]

[project.optional-dependencies]
# Desktop window (packaging/desktop/launcher.py). pywebview pulls pyobjc on macOS; on Linux it
# uses the distro gi/WebKit2, exposed to the venv by packaging/desktop/linux/install.sh.
desktop = ["pywebview>=6.2"]

[dependency-groups]
dev = ["pytest", "httpx"]
