[project]
name = "library"
version = "2.0.0"
description = "Workbench over a documents store (SQLite) with Claude-in-the-loop editing"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "fastapi",
    "uvicorn",
    "jinja2",
    "python-multipart",
    "markdown",
    "nh3",
    # Session login (auth.py, ADR 0003): bcrypt password hash, TOTP second factor,
    # itsdangerous signs the Starlette SessionMiddleware cookie, dotenv reads library/.env.
    "bcrypt>=4.0",
    "pyotp>=2.9",
    "itsdangerous>=2.1",
    "python-dotenv",
]

[project.optional-dependencies]
# Desktop window (packaging/desktop/launcher.py). pywebview pulls pyobjc on macOS; on Linux it
# uses the distro gi/WebKit2, exposed to the venv by packaging/desktop/linux/install.sh.
desktop = ["pywebview>=6.2"]

[dependency-groups]
dev = ["pytest", "httpx"]
